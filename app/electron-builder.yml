appId: com.clipwright.studio
productName: Clipwright Studio
copyright: Copyright © 2026

# electron-updater reads latest.yml and the installer/blockmap from GitHub Releases.
publish:
  provider: github
  owner: yetiwrld
  repo: Clip
  releaseType: release

directories:
  buildResources: build
  output: dist

# Only what the app needs at runtime. Renderer is fully bundled into out/renderer.
files:
  - out/**
  - package.json
  - "!**/*.map"

# Executables and WASM must be unpacked from the asar archive so that
# FFmpeg/FFprobe/sql.js can be spawned/loaded by the OS.
asarUnpack:
  - node_modules/@ffmpeg-installer/**
  - node_modules/@ffprobe-installer/**
  - node_modules/sql.js/dist/sql-wasm.wasm

extraResources:
  - from: resources/fonts
    to: fonts
  - from: scripts/python
    to: python
  - from: resources/bin
    to: bin

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Clipwright Studio
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico

portable:
  artifactName: ${productName}-${version}-portable.${ext}

mac:
  target: [dmg]
  category: public.app-category.video

linux:
  target: [AppImage]
  category: Video
