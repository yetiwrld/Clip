name: Repair Windows release assets

on:
  push:
    tags:
      - 'repair-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to populate (for example v0.0.4)
        required: true
        type: string
        default: v0.0.4

permissions:
  contents: write

jobs:
  repair-windows-assets:
    name: Build and upload updater assets
    runs-on: windows-latest
    steps:
      - name: Determine the release tag to repair
        id: release
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          TRIGGER_REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REQUESTED_TAG) {
            $tag = $env:REQUESTED_TAG
          } else {
            $match = [regex]::Match($env:TRIGGER_REF_NAME, '^repair-(v\d+\.\d+\.\d+)(?:-\d+)?$')
            if (-not $match.Success) { throw "Unexpected repair trigger tag: $($env:TRIGGER_REF_NAME)" }
            $tag = $match.Groups[1].Value
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Extract app source
        shell: pwsh
        run: Expand-Archive -Path AIClipping-code-for-AI.zip -DestinationPath build-source -Force

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build-source/package-lock.json

      - name: Validate existing release tag
        shell: pwsh
        working-directory: build-source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -ne "v$($package.version)") {
            throw "Tag $($env:RELEASE_TAG) does not match app version $($package.version)."
          }

      - name: Install build dependencies
        working-directory: build-source
        run: npm ci

      - name: Build installer without publishing
        working-directory: build-source
        run: npm run dist:win -- --publish never

      - name: Generate matching update metadata and upload all assets
        shell: pwsh
        working-directory: build-source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $package.version
          $installer = Get-ChildItem dist -File -Filter "*-$version-setup-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "No x64 NSIS installer was produced for $version." }
          $blockmap = Get-Item "$($installer.FullName).blockmap" -ErrorAction SilentlyContinue
          if (-not $blockmap) { throw "The installer blockmap was not produced: $($installer.Name).blockmap" }

          # Normalize the uploaded asset name to match electron-builder's GitHub Releases naming.
          $assetName = $installer.Name -replace ' ', '-'
          $assetPath = Join-Path $installer.DirectoryName $assetName
          $blockmapPath = "$assetPath.blockmap"
          if ($assetPath -ne $installer.FullName) { Copy-Item $installer.FullName $assetPath -Force }
          if ($blockmap.FullName -ne $blockmapPath) { Copy-Item $blockmap.FullName $blockmapPath -Force }

          $stream = [System.IO.File]::OpenRead($assetPath)
          try {
            $hasher = [System.Security.Cryptography.SHA512]::Create()
            try { $sha512 = [Convert]::ToBase64String($hasher.ComputeHash($stream)) }
            finally { $hasher.Dispose() }
          }
          finally { $stream.Dispose() }
          $size = (Get-Item $assetPath).Length
          $releaseDate = [DateTime]::UtcNow.ToString("yyyy-MM-dd'T'HH:mm:ss.fff'Z'")
          $metadata = @"
          version: $version
          files:
            - url: $assetName
              sha512: $sha512
              size: $size
          path: $assetName
          sha512: $sha512
          releaseDate: '$releaseDate'
          "@
          $metadataPath = Join-Path (Resolve-Path dist) 'latest.yml'
          [System.IO.File]::WriteAllText($metadataPath, $metadata.TrimStart(), [System.Text.UTF8Encoding]::new($false))

          # Resolve GitHub's actual latest release object explicitly. A tag can have multiple
          # release records, and `gh release upload <tag>` may select a different one.
          $repository = $env:GITHUB_REPOSITORY
          $releaseJson = gh api "repos/$repository/releases/latest" | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the latest GitHub release.' }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.tag_name -ne $env:RELEASE_TAG) {
            throw "Latest release tag $($release.tag_name) does not match $($env:RELEASE_TAG)."
          }

          $expectedAssetNames = @($assetName, "$assetName.blockmap", 'latest.yml')
          foreach ($existingAsset in $release.assets) {
            if ($expectedAssetNames -contains $existingAsset.name) {
              gh api "repos/$repository/releases/assets/$($existingAsset.id)" --method DELETE --silent
              if ($LASTEXITCODE -ne 0) { throw "Could not replace release asset $($existingAsset.name)." }
            }
          }

          $uploadUrl = "https://uploads.github.com/repos/$repository/releases/$($release.id)/assets"
          foreach ($file in @($assetPath, $blockmapPath, $metadataPath)) {
            $name = [System.IO.Path]::GetFileName($file)
            $encodedName = [uri]::EscapeDataString($name)
            $curlArgs = @(
              '--fail-with-body', '--silent', '--show-error', '--request', 'POST',
              '--header', 'Accept: application/vnd.github+json',
              '--header', "Authorization: Bearer $env:GH_TOKEN",
              '--header', 'X-GitHub-Api-Version: 2022-11-28',
              '--header', 'Content-Type: application/octet-stream',
              '--data-binary', "@$file",
              "$uploadUrl?name=$encodedName"
            )
            & curl.exe @curlArgs | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Uploading release asset $name failed." }
          }

          $verifiedJson = gh api "repos/$repository/releases/latest" | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the updated latest release.' }
          $verifiedRelease = $verifiedJson | ConvertFrom-Json
          if ($verifiedRelease.id -ne $release.id -or $verifiedRelease.tag_name -ne $env:RELEASE_TAG) {
            throw 'The updated release is no longer the repository latest release.'
          }
          $expectedSizes = @{}
          $expectedSizes[$assetName] = [long]$size
          $expectedSizes["$assetName.blockmap"] = [long](Get-Item $blockmapPath).Length
          $expectedSizes['latest.yml'] = [long](Get-Item $metadataPath).Length
          foreach ($expectedName in $expectedSizes.Keys) {
            $uploaded = $verifiedRelease.assets | Where-Object name -eq $expectedName | Select-Object -First 1
            if (-not $uploaded -or [long]$uploaded.size -ne $expectedSizes[$expectedName]) {
              throw "Latest release asset $expectedName is missing or has an unexpected size."
            }
          }
          Write-Host "Verified $($verifiedRelease.tag_name) on latest release $($verifiedRelease.id): $assetName, $($assetName).blockmap, latest.yml; $size bytes; SHA-512 $sha512"
